jobs:
  container:
    name: Container smoke (the release image)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: lazy-trees = true
    - name: Setup Nix cache
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
    - name: Boot the image
      run: bash nix/container-smoke.sh
    timeout-minutes: 45
  hermetic:
    name: nix flake check (hermetic build)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: lazy-trees = true
    - name: Setup Nix cache
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
    - run: nix flake check -L
    timeout-minutes: 45
  node:
    name: tsc · eslint · vitest · build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: lazy-trees = true
    - name: Setup Nix cache
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
    - name: Setup npm cache
      uses: actions/cache@v4
      with:
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        path: ~/.npm
        restore-keys: npm-${{ runner.os }}-
    - name: npm ci
      run: nix develop --command npm ci
    - name: tsc
      run: nix develop --command npm run typecheck
    - name: eslint
      run: nix develop --command npx eslint .
    - name: vitest
      run: nix develop --command npx vitest run
    - name: next build
      run: nix develop --command npm run build
    timeout-minutes: 30
name: Errors
'on':
  pull_request: {}
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
