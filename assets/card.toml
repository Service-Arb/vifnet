# The one place a contact fact is written — the site reads it (`withLanding`
# inlines it at build), and a printed card or a vCard would too.
#
# Vifnet has no domain, no public number and no public mailbox yet
# (OWNER_TODO in src/shared/config/site.ts). Without `site` the whole site is
