# Vifnet's single source for colour, in the `@evinvest/uikit` token vocabulary.
# The page is drawn in Figma `1wXlPmnmOdKYPDWz6N5EB8` (Vifnet, Desktop 1440
# 9:107 / Mobile 390 14:502); every hex here is one of its variables, so the
# page matches the frame to the value. `npm run palette` emits `app/brand.css`
# from it and fails on a hole in either scope; a test holds the committed copy
# to this file.
#
# Figma → token: forest #0f2419 is `brand` (both scopes), light `secondary`,
# dark `background` and `on-primary`; forest-mid #1a3a28 dark `card` (stats and
# guarantee bands); forest-deep #0a1a10 dark `popover` (footer, phone menu);
# leaf #2d6a4f light `positive`/`primary-ink`/`ring`; leaf-light #52b788 dark
# `positive` (the headline's accent); gold #e8a838 `primary`, `accent-warn`
# (stars) and the dark `ring`/`primary-ink`; cream #fafaf7 light `card`
# (services and FAQ bands); sage #f0f7f0 light `hover` (FAQ row); ink #1a1a1a
# light `ink`. The frame's neutrals are Tailwind's slate scale: slate-600/500
# are light `ink-mid`/`ink-soft`, slate-100 `border`/`muted`, slate-200
# `input`; the dark scope's ink is white, so kit parts inherit it. The dark
# `ink-mid`/`ink-soft` are the frame's white/70 and white/50 over forest.
#
# The frame, not a floor, sets these values. Where it falls short of WCAG the
# finding is reported, not patched here: the field border (slate-200 on white,
# 1.23:1, wants 3:1), slate-400 meta text on white (2.6:1).
#
# Values only, no layout: geometry lives in `app/globals.css`.

# The printed word is one colour; the second half is empty so nothing takes
# primary. The drawn mark (house, swoosh, star) is the SVG, not this text.
wordmark = ["Vifnet", ""]

# `<Logo>` masks this file, so it paints one colour (currentColor); the gold
# star and the leaf swoosh need the inline SVG. Uncomment when the file is in
# public/:
# mark = "/assets/vifnet-mark.svg"
# mark-aspect = "112 / 72"

