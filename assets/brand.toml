# Vifnet's single source for colour, in the `@evinvest/uikit` token vocabulary.
# Forest and leaf come from the printed identity (business cards, aprons, polos
# in assets/profile_images); the page is drawn in Figma `1wXlPmnmOdKYPDWz6N5EB8`
# ("Cleaning site"), whose variables map onto these tokens. The previous source
# was Figma `11BVyibSdB8fBYrfBiLX3C`. `npm run palette` emits `app/brand.css`
# from it and fails on a hole in either scope; a test holds the committed copy
# to this file.
#
# Forest is the brand and the ink, gold the action, leaf the link and the ring.
# Gold is `primary`: every CTA is a gold fill, and the label on it is dark
# (forest, `on-primary`, 7.84:1) — never white. On a light surface gold is
# never text or an indicator (2.08:1 on white), so there `primary-ink` and
# `ring` are leaf; on a dark surface gold is both. The stars stay in
# `accent-warn`, the same gold as a fill. The mark's swoosh reads `positive`
# (leaf / leaf-light), not the gold action.
#
# Two scopes, because a `<Section polarity=…>` re-themes its subtree: both carry
# every name. A surface takes its ink from its scope; a filled role carries its
# own `on-*`. Accents are ordered quiet to loud (ev_lib docs/spec/accents.md);
# trace/debug/info share one quiet value until a design separates them.
# Neutrals are tinted green (the Figma file's are cold slate), never pure grey
# or black.
#
# Held to the kit's floors (lib ts/uikit/test/tokens.test.ts) and WCAG AA:
#   light  ink 16.3:1 on white, 15.6:1 on card · ink-mid 9.05:1 / 8.65:1
#          ink-soft 5.45:1 on white, 5.21:1 on card, 5.0:1 on hover
#          primary-ink and ring (leaf) 6.39:1 on white, 6.11:1 on card
#          on-primary 7.84:1 on gold · on-secondary 15.6:1 · on-positive 6.39:1
#          input 3.06:1 on white (WCAG 1.4.11) · muted vs card 1.42:1
#   dark   ink 15.6:1 on background, 12.0:1 on card · ink-mid 9.87:1 / 7.56:1
#          ink-soft 6.63:1 on background, 5.08:1 on card, 7.3:1 on popover
#          primary-ink and ring (gold) 7.84:1 on background, 6.01:1 on card
#          on-primary 7.84:1 · on-secondary 11.58:1 · positive 6.6:1 on background
#          input 4.05:1 on background
#
# Values only, no layout: geometry lives in `app/globals.css`.

# The printed word is one colour; the second half is empty so nothing takes
# primary. The drawn mark (house, swoosh, star) is the SVG, not this text.
wordmark = ["Vifnet", ""]

# `<Logo>` masks this file, so it paints one colour (currentColor); the gold
# star and the leaf swoosh need the inline SVG. Uncomment when the file is in
# public/:
# mark = "/assets/vifnet-mark.svg"
# mark-aspect = "112 / 72"

