# TEMPORARY. There is no Vifnet design yet; this palette exists so the site
# builds on the kit's token contract and `evinvest-palette` has both scopes to
# check. Replace it wholesale when the Figma file lands — nothing here is a
# brand decision.
#
# The brand's single source for colour, in the `@evinvest/uikit` token
# vocabulary. `npm run palette` emits `app/brand.css` from it and fails on a
# hole in either scope or a pair under the kit's contrast floors; a test holds
# the committed copy to this file.
#
# Two scopes, because a `<Section polarity=…>` re-themes its subtree: both carry
# every name. A surface takes its ink from its scope; a filled role carries its
# own `on-*`. Accents are ordered quiet to loud (ev_lib docs/spec/accents.md);
# trace/debug/info share one quiet value until a design separates them.
#
# Values only, no layout: geometry lives in `app/globals.css`.

wordmark = ["VIF", "NET"] # the second half takes primary

[colors.light]
background = "#ffffff"
card = "#f4f8f7"
muted = "#d3e2df"
popover = "#ffffff"
hover = "#e8f0ee"
ink = "#0b1f1d"
