# Vifnet's single source for colour, in the `@evinvest/uikit` token vocabulary.
# Taken from the printed identity (business cards, aprons, polos in
# assets/profile_images) and drawn in Figma `11BVyibSdB8fBYrfBiLX3C`, whose
# `ev/theme` modes "vifnet · light" / "vifnet · dark" carry the same values
# (mirrored in the design source of truth `e0V2P1cQpEFRuXTeNtEMh6`).
# `npm run palette` emits `app/brand.css` from it and fails on a hole in either
# scope; a test holds the committed copy to this file.
#
# Forest green is the brand, leaf green the action, gold the star. Gold lives
# in `accent-warn` because the kit has no rating token: it is reserved for the
# mark's star and review stars, and it is a fill (label `on-accent-warn`), never
# text on a light surface (1.9:1 on white).
#
# Two scopes, because a `<Section polarity=…>` re-themes its subtree: both carry
# every name. A surface takes its ink from its scope; a filled role carries its
# own `on-*`. Accents are ordered quiet to loud (ev_lib docs/spec/accents.md);
# trace/debug/info share one quiet value until a design separates them.
# Neutrals are tinted green, never pure grey or black.
#
# Held to the kit's floors (lib ts/uikit/test/tokens.test.ts) and WCAG AA:
#   light  ink 16.2:1 on white · ink-soft 5.45:1 on white, 5.09:1 on card
#          on-primary 5.10:1 · primary-ink 6.49:1 on white, 6.06:1 on card
#          muted vs card 1.38:1 (slider track) · primary-ink on muted 4.39:1
#   dark   ink 16.4:1 on background · ink-soft 9.16:1 on background, 7.28:1 on card
#          primary 7.79:1 on background, on-primary 7.79:1 · primary-ink 7.65:1 on card
#   both   every on-* ≥ 4.77:1 on its fill; the ring ≥ 4.44:1 on every surface
#
# Values only, no layout: geometry lives in `app/globals.css`.

# The printed word is one colour; the second half is empty so nothing takes
# primary. The drawn mark (house, swoosh, star) is the SVG, not this text.
wordmark = ["Vifnet", ""]

# `<Logo>` masks this file, so it paints one colour (currentColor); the gold
# star and the leaf swoosh need the inline SVG. Uncomment when the file is in
# public/:
# mark = "/assets/vifnet-mark.svg"
# mark-aspect = "112 / 72"

